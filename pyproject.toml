[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azurpromilia-switcher"
version = "0.1.0"
description = "Azur Promilia CN/global client switcher, sharing identical resources via NTFS hard links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "username-1234567" }]
keywords = ["azur-promilia", "hardlink", "ntfs", "switcher", "windows"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
crypto = ["pycryptodome>=3.20"]

[project.scripts]
azp = "azp.cli:main"

[tool.setuptools.packages.find]
include = ["azp*"]
[tool.setuptools.package-data]
azp = ["patches/cn/nofade/*"]
